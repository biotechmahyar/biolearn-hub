limit_req_zone $binary_remote_addr zone=emergency_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=emergency_login:10m rate=5r/m;

upstream genova_emergency_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name emergency.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name emergency.example.com;

    ssl_certificate /etc/letsencrypt/live/emergency.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emergency.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /api/auth/login {
        limit_req zone=emergency_login burst=5 nodelay;
        proxy_pass http://genova_emergency_backend;
    }

    location /api/ {
        limit_req zone=emergency_api burst=20 nodelay;
        proxy_pass http://genova_emergency_backend;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://genova_emergency_backend;
    }

    location / {
        proxy_pass http://genova_emergency_backend;
    }
}
