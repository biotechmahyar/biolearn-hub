{% extends "base.html" %}
{% block title %}پروفایل — داشبورد{% endblock %}
{% block content %}
<div class="container-sm" style="padding-top:2rem">
  <a href="/dashboard" style="font-size:0.85rem">← بازگشت به داشبورد</a>
  <div class="card" style="margin-top:1rem">
    <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:1rem">👤 پروفایل من</h2>
    {% if saved %}<div class="alert alert-success">تغییرات ذخیره شد.</div>{% endif %}
    <form method="post" action="/dashboard/profile">
      <div class="form-group">
        <label>نام</label>
        <input type="text" name="name" class="form-input" value="{{ user.name }}">
      </div>
      <div class="form-group">
        <label>ایمیل</label>
        <input type="email" class="form-input" value="{{ user.email }}" disabled style="opacity:0.6">
      </div>
      <div class="form-group">
        <label>تلفن</label>
        <input type="text" name="phone" class="form-input" value="{{ user.phone or '' }}">
      </div>
      <div class="form-group">
        <label>معرفی</label>
        <textarea name="bio" class="form-input">{{ user.bio or '' }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">ذخیره تغییرات</button>
    </form>
  </div>
</div>
{% endblock %}
