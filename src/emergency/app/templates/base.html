<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NIBRC Emergency{% endblock %}</title>
  <link rel="stylesheet" href="/emergency/static/css/main.css">
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="/emergency/" class="navbar-brand">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="16" fill="#0b1120"/>
          <g fill="none" stroke="#14b8a6" stroke-width="3.4" stroke-linecap="round">
            <path d="M22 14c0 12 20 24 20 36" opacity="0.55"/>
            <path d="M42 14c0 12-20 24-20 36" opacity="0.55"/>
            <path d="M22 22h20M21 32h22M22 42h20"/>
          </g>
          <circle cx="22" cy="14" r="3.4" fill="#5eead4"/>
          <circle cx="42" cy="50" r="3.4" fill="#7dd3fc"/>
        </svg>
        NIBRC
        <span class="emergency-badge">⚡ اضطراری</span>
      </a>
      <ul class="navbar-links">
        <li><a href="/emergency/">خانه</a></li>
        <li><a href="/emergency/courses">دوره‌ها</a></li>
        <li><a href="/emergency/articles">مقاله‌ها</a></li>
        <li><a href="/emergency/dictionary">واژه‌نامه</a></li>
        <li><a href="/emergency/workshops">کارگاه‌ها</a></li>
        <li><a href="/emergency/products">محصولات</a></li>
        {% if user %}
          <li><a href="/emergency/dashboard">داشبورد</a></li>
          <li><a href="/emergency/auth/logout">خروج</a></li>
        {% else %}
          <li><a href="/emergency/auth/login">ورود</a></li>
          <li><a href="/emergency/auth/register">ثبت‌نام</a></li>
        {% endif %}
      </ul>
      <button class="navbar-menu-btn" onclick="document.querySelector('.navbar-links').classList.toggle('show')">☰</button>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>نسخه اضطراری NIBRC — سرور داخل ایران</p>
      <p style="margin-top:0.25rem;font-size:0.7rem;opacity:0.5">بدون وابستگی به اینترنت بین‌الملل</p>
    </div>
  </footer>
</body>
</html>
