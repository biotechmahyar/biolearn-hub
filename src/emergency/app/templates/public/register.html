{% extends "base.html" %}
{% block title %}ثبت‌نام — NIBRC Emergency{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2>📝 ثبت‌نام جدید</h2>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/auth/register">
      <div class="form-group">
        <label>نام و نام خانوادگی</label>
        <input type="text" name="name" class="form-input" placeholder="نام کامل" required>
      </div>
      <div class="form-group">
        <label>ایمیل</label>
        <input type="email" name="email" class="form-input" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label>رمز عبور</label>
        <input type="password" name="password" class="form-input" placeholder="حداقل ۶ کاراکتر" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">ثبت‌نام</button>
    </form>
    <div class="links">
      قبلاً ثبت‌نام کرده‌اید؟ <a href="/auth/login">ورود</a>
    </div>
    <a href="/" class="emergency-link">⚡ نسخه اضطراری — بدون نیاز به اینترنت بین‌الملل</a>
  </div>
</div>
{% endblock %}
