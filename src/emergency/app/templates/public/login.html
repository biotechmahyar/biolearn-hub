{% extends "base.html" %}
{% block title %}ورود — NIBRC Emergency{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2>🔐 ورود به حساب</h2>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/emergency/auth/login">
      <div class="form-group">
        <label>ایمیل</label>
        <input type="email" name="email" class="form-input" placeholder="example@email.com" required>
      </div>
      <div class="form-group">
        <label>رمز عبور</label>
        <input type="password" name="password" class="form-input" placeholder="رمز عبور" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">ورود</button>
    </form>
    <div class="links">
      حساب ندارید؟ <a href="/emergency/auth/register">ثبت‌نام کنید</a>
    </div>
  </div>
</div>
{% endblock %}
