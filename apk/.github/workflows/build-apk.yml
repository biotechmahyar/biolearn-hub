name: Build Genova Android APK

on:
  workflow_dispatch:
    inputs:
      convex_url:
        description: "Convex deployment URL (e.g. https://xxxx.convex.cloud) — baked into the APK. Leave empty to use .env.local of the repo."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node 20 (needed by Capacitor tooling)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17 (Android SDK is preinstalled on ubuntu-latest)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── 1) Build the real web app ─────────────────────────────────────────
      - name: Install web dependencies
        run: bun install

      - name: Determine Convex URL
        id: convex
        run: |
          if [ -n "${{ github.event.inputs.convex_url }}" ]; then
            echo "url=${{ github.event.inputs.convex_url }}" >> "$GITHUB_OUTPUT"
          else
            URL="$(grep -E '^VITE_CONVEX_URL=' .env.local 2>/dev/null | cut -d= -f2- | tr -d '\"' || true)"
            if [ -z "$URL" ]; then
              echo "::error::No convex_url input and no VITE_CONVEX_URL in .env.local"
              exit 1
            fi
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web bundle (Vite)
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ steps.convex.outputs.url }}

      # ── 2) Bundle into Capacitor Android shell ────────────────────────────
      - name: Prepare Capacitor shell
        working-directory: apk
        run: |
          npm install
          mkdir -p www
          cp -r ../dist/* www/
          # remove dev-only marker files not needed at runtime
          rm -f www/convex-config.js www/index.js

      - name: Add Android platform & sync
        working-directory: apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply branded launcher icons + splash
        working-directory: apk
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            size=96
            case $d in
              mdpi) size=48;; hdpi) size=72;; xhdpi) size=96;;
              xxhdpi) size=144;; xxxhdpi) size=192;;
            esac
            python3 resources/gen_icons.py --size $size --out \
              "android/app/src/main/res/mipmap-$d/ic_launcher.png" || true
          done
          python3 resources/gen_icons.py --size 512 --out \
            "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png" || true

      - name: Apply AndroidManifest (INTERNET + singleTask)
        run: |
          cp apk/android-manifest/AndroidManifest.xml \
             apk/android/app/src/main/AndroidManifest.xml

      # ── 3) Build & sign ───────────────────────────────────────────────────
      - name: Build release APK
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Generate signing keystore
        working-directory: apk
        run: |
          keytool -genkeypair -v \
            -keystore genova.keystore \
            -storepass genova1234 -keypass genova1234 \
            -alias genova -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Genova, OU=NIBRC, O=NIBRC, L=Tehran, C=IR"

      - name: Sign APK
        working-directory: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "app-release-unsigned.apk" | head -1)
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks genova.keystore \
            --ks-pass pass:genova1234 --key-pass pass:genova1234 \
            --out genova-release-signed.apk "$APK"
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify genova-release-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: genova-android-apk
          path: apk/genova-release-signed.apk
          if-no-files-found: error
          retention-days: 90
