<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Genova</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0b1120;
      font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
      color: #e2e8f0;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 132px;
      height: 132px;
      border-radius: 30px;
      box-shadow: 0 0 42px rgba(20, 184, 166, 0.28);
      animation: float 3.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #5eead4, #7dd3fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #64748b;
    }
    .dna {
      display: flex;
      gap: 6px;
      height: 26px;
      align-items: center;
    }
    .dna span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #14b8a6;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dna span:nth-child(2) { animation-delay: 0.15s; background: #0ea5e9; }
    .dna span:nth-child(3) { animation-delay: 0.3s; }
    .dna span:nth-child(4) { animation-delay: 0.45s; background: #0ea5e9; }
    .dna span:nth-child(5) { animation-delay: 0.6s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    .status {
      font-size: 12px;
      color: #475569;
      min-height: 18px;
    }
    .error {
      color: #f87171;
      max-width: 320px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="./icon.png" alt="Genova" onerror="this.style.display='none'" />
    <div class="title">Genova</div>
    <div class="subtitle">اکوسیستم آموزش علوم زیستی</div>
    <div class="dna"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="status" id="status">در حال آماده‌سازی…</div>
  </div>
  <script src="./convex-config.js"></script>
  <script src="./index.js"></script>
</body>
</html>
