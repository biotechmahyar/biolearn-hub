version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - MAIN_SITE_URL=${MAIN_SITE_URL:-https://nibrc.ir}
      - SYNC_API_KEY=${SYNC_API_KEY:-changeme-sync-secret-key}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-1800}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/genova.db}
      - JWT_SECRET=${JWT_SECRET:-change-me}
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
