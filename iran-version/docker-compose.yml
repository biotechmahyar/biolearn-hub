version: "3.8"

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nibrc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nibrc
      POSTGRES_USER: nibrc
      POSTGRES_PASSWORD: nibrc_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibrc -d nibrc"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nibrc-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://nibrc:nibrc_secret@postgres:5432/nibrc
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 15m
      REFRESH_SECRET: ${REFRESH_SECRET:-change-me-in-production}
      REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  # ── MinIO (Optional — for S3-compatible storage) ────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nibrc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    profiles:
      - with-minio  # Only starts with: docker compose --profile with-minio up

  # ── Frontend (Development) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nibrc-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    profiles:
      - frontend  # Only starts with: docker compose --profile frontend up

volumes:
  postgres_data:
  backend_storage:
  minio_data:
