<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Genova — پلتفرم داخلی تیم برای آموزش تخصصی علوم زیستی؛ دوره، آزمون، دیکشنری و مدیریت کامل." />
  <title>Genova | پلتفرم داخلی علوم زیستی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    // Apply saved appearance before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var raw = window.localStorage.getItem("genova-settings");
        var s = raw ? JSON.parse(raw) : {};
        var root = document.documentElement;
        if (s.theme === "light") root.classList.remove("dark");
        else root.classList.add("dark");
        if (s.accent) root.setAttribute("data-accent", s.accent);
        if (s.font) root.setAttribute("data-font", s.font);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
